  <path d="M188 345l-29 91m165-91 29 91" stroke="#6d8eb9" stroke-width="13" stroke-linecap="round"/>
  <path d="M180 213c0-81 34-131 76-131s76 50 76 131v30c0 73-38 116-76 116s-76-43-76-116z" fill="url(#suit)" stroke="#e5f2ff" stroke-width="13"/>
  <ellipse cx="256" cy="222" rx="112" ry="99" fill="url(#visor)" stroke="#dcecff" stroke-width="17"/>
  <ellipse cx="256" cy="222" rx="96" ry="83" fill="none" stroke="#36c9ff" stroke-width="7" opacity=".85"/>
