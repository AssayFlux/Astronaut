<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Astronaut app icon</title><desc id="desc">A friendly astronaut helmet framed by a glowing orbital ring against deep space.</desc>
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101b49"/><stop offset="1" stop-color="#030817"/></linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a855f7"/><stop offset=".52" stop-color="#22d3ee"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#a9c5e8"/></linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#162b68"/><stop offset=".55" stop-color="#07132e"/><stop offset="1" stop-color="#050a1b"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
