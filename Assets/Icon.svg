<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="spaceGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    
    <!-- Helmet reflection gradient -->
    <radialGradient id="helmetGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#00ffcc"/>
      <stop offset="25%" stop-color="#ff00aa"/>
      <stop offset="50%" stop-color="#00aaff"/>
      <stop offset="75%" stop-color="#ff5500"/>
      <stop offset="100%" stop-color="#001122"/>
    </radialGradient>
    
    <!-- Jellyfish body gradient -->
    <radialGradient id="jellyGrad" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#00ffcc"/>
      <stop offset="30%" stop-color="#ff00cc"/>
      <stop offset="60%" stop-color="#ffaa00"/>
      <stop offset="100%" stop-color="#00aaff"/>
    </radialGradient>
    
    <!-- Soft glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Deep space background -->
  <rect width="1000" height="1000" fill="url(#spaceGrad)"/>
  
  <!-- Stars -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="80" cy="120" r="1.2"/>
    <circle cx="150" cy="60" r="0.8"/>
    <circle cx="220" cy="180" r="1.5"/>
    <circle cx="90" cy="280" r="0.9"/>
    <circle cx="310" cy="90" r="1.1"/>
    <circle cx="400" cy="40" r="0.7"/>
    <circle cx="480" cy="130" r="1.3"/>
    <circle cx="550" cy="70" r="0.8"/>
    <circle cx="620" cy="160" r="1.0"/>
    <circle cx="700" cy="50" r="1.4"/>
    <circle cx="780" cy="110" r="0.9"/>
    <circle cx="850" cy="80" r="1.2"/>
    <circle cx="920" cy="150" r="0.7"/>
    <circle cx="960" cy="40" r="1.0"/>
    <circle cx="70" cy="400" r="1.1"/>
    <circle cx="180" cy="350" r="0.8"/>
    <circle cx="40" cy="520" r="1.3"/>
    <circle cx="130" cy="600" r="0.9"/>
    <circle cx="50" cy="720" r="1.0"/>
    <circle cx="200" cy="780" r="0.7"/>
    <circle cx="90" cy="850" r="1.2"/>
    <circle cx="160" cy="920" r="0.8"/>
    <circle cx="280" cy="880" r="1.1"/>
    <circle cx="350" cy="950" r="0.9"/>
    <circle cx="420" cy="890" r="1.0"/>
    <circle cx="500" cy="960" r="0.7"/>
    <circle cx="580" cy="910" r="1.3"/>
    <circle cx="650" cy="970" r="0.8"/>
    <circle cx="730" cy="900" r="1.1"/>
    <circle cx="810" cy="950" r="0.9"/>
    <circle cx="890" cy="880" r="1.0"/>
    <circle cx="950" cy="940" r="0.7"/>
    <circle cx="880" cy="700" r="1.2"/>
    <circle cx="940" cy="620" r="0.8"/>
    <circle cx="870" cy="520" r="1.1"/>
    <circle cx="960" cy="450" r="0.9"/>
    <circle cx="900" cy="380" r="1.0"/>
    <circle cx="970" cy="300" r="0.7"/>
    <circle cx="820" cy="250" r="1.3"/>
    <circle cx="750" cy="320" r="0.8"/>
    <circle cx="680" cy="280" r="1.1"/>
    <circle cx="600" cy="350" r="0.9"/>
    <circle cx="520" cy="290" r="1.0"/>
    <circle cx="450" cy="380" r="0.7"/>
    <circle cx="380" cy="320" r="1.2"/>
    <circle cx="300" cy="400" r="0.8"/>
    <circle cx="240" cy="340" r="1.1"/>
    <!-- Extra faint stars -->
    <circle cx="120" cy="200" r="0.5" opacity="0.5"/>
    <circle cx="340" cy="150" r="0.4" opacity="0.6"/>
    <circle cx="460" cy="220" r="0.5" opacity="0.5"/>
    <circle cx="640" cy="100" r="0.4" opacity="0.6"/>
    <circle cx="800" cy="200" r="0.5" opacity="0.5"/>
    <circle cx="250" cy="550" r="0.4" opacity="0.6"/>
    <circle cx="430" cy="700" r="0.5" opacity="0.5"/>
    <circle cx="560" cy="820" r="0.4" opacity="0.6"/>
    <circle cx="720" cy="750" r="0.5" opacity="0.5"/>
    <circle cx="860" cy="820" r="0.4" opacity="0.6"/>
  </g>
  
  <!-- Astronaut group -->
  <g transform="translate(500,480)">
    
    <!-- Backpack -->
    <g>
      <path d="M95,-60 C110,-80 145,-95 165,-70 C180,-45 175,-10 160,20 C150,45 130,55 105,45 C85,35 80,-20 95,-60 Z" 
            fill="#1a2a3a" stroke="#4a6a8a" stroke-width="2.5"/>
      <path d="M105,-45 C115,-55 140,-60 150,-40 C155,-20 150,5 140,20 C130,30 115,25 108,10 C100,-10 100,-30 105,-45 Z" 
            fill="#0f1a25"/>
      <!-- Backpack details -->
      <rect x="120" y="-30" width="25" height="8" rx="2" fill="#2a4a6a"/>
      <rect x="125" y="-5" width="18" height="6" rx="1.5" fill="#2a4a6a"/>
    </g>
    
    <!-- Body / Suit -->
    <g>
      <!-- Main torso -->
      <path d="M-55,-30 C-70,-80 -40,-140 10,-155 C50,-160 80,-130 85,-80 C90,-30 70,20 40,60 C20,85 -20,90 -45,70 C-65,50 -60,0 -55,-30 Z" 
            fill="#1e3a50" stroke="#5a8aaa" stroke-width="3"/>
      
      <!-- Suit panel lines -->
      <path d="M-25,-100 Q0,-110 25,-95" fill="none" stroke="#3a6a8a" stroke-width="2" opacity="0.7"/>
      <path d="M-30,-60 Q5,-70 30,-55" fill="none" stroke="#3a6a8a" stroke-width="2" opacity="0.7"/>
      <path d="M-35,-20 Q0,-30 25,-15" fill="none" stroke="#3a6a8a" stroke-width="2" opacity="0.7"/>
      
      <!-- Chest details -->
      <ellipse cx="5" cy="-40" rx="18" ry="12" fill="#0a1520" stroke="#4a7a9a" stroke-width="1.5"/>
      <circle cx="5" cy="-40" r="5" fill="#00ccff" opacity="0.6"/>
      
      <!-- Arm (left - holding) -->
      <path d="M-55,-40 C-90,-50 -120,-30 -130,10 C-135,35 -120,50 -95,45 C-75,40 -60,20 -55,-5 Z" 
            fill="#1e3a50" stroke="#5a8aaa" stroke-width="2.5"/>
      
      <!-- Glove left -->
      <ellipse cx="-115" cy="25" rx="22" ry="18" fill="#2a4a65" stroke="#6a9aba" stroke-width="2"/>
      <path d="M-130,20 Q-125,35 -115,40 Q-105,35 -100,20" fill="none" stroke="#4a7a9a" stroke-width="1.5"/>
      
      <!-- Arm (right) -->
      <path d="M40,-50 C70,-70 100,-40 105,5 C108,30 90,50 65,45 C45,40 35,15 40,-10 Z" 
            fill="#1e3a50" stroke="#5a8aaa" stroke-width="2.5"/>
      
      <!-- Glove right -->
      <ellipse cx="90" cy="20" rx="20" ry="16" fill="#2a4a65" stroke="#6a9aba" stroke-width="2"/>
      
      <!-- Legs -->
      <path d="M-30,55 C-45,100 -40,160 -25,200 C-15,220 5,215 10,190 C15,160 5,110 0,70 Z" 
            fill="#1a3550" stroke="#4a7a9a" stroke-width="2.5"/>
      <path d="M15,60 C25,110 30,160 40,195 C48,215 70,210 70,185 C68,155 55,110 45,70 Z" 
            fill="#1a3550" stroke="#4a7a9a" stroke-width="2.5"/>
      
      <!-- Boot details -->
      <ellipse cx="-20" cy="205" rx="22" ry="12" fill="#0f2030" stroke="#3a6a8a" stroke-width="2"/>
      <ellipse cx="50" cy="200" rx="20" ry="11" fill="#0f2030" stroke="#3a6a8a" stroke-width="2"/>
    </g>
    
    <!-- Helmet -->
    <g>
      <!-- Helmet outer shell -->
      <ellipse cx="5" cy="-145" rx="68" ry="72" fill="#2a4a65" stroke="#7ab0d0" stroke-width="4"/>
      
      <!-- Visor -->
      <ellipse cx="5" cy="-145" rx="52" ry="55" fill="url(#helmetGrad)" stroke="#a0d0f0" stroke-width="3"/>
      
      <!-- Visor highlight -->
      <ellipse cx="-15" cy="-165" rx="18" ry="12" fill="#ffffff" opacity="0.15"/>
      
      <!-- Helmet rim details -->
      <path d="M-55,-120 Q5,-95 65,-120" fill="none" stroke="#5a90b0" stroke-width="3"/>
      <path d="M-50,-175 Q5,-195 60,-175" fill="none" stroke="#5a90b0" stroke-width="2.5"/>
    </g>
    
    <!-- Neon jellyfish -->
    <g filter="url(#softGlow)">
      <!-- Tentacles -->
      <g stroke-width="2.5" fill="none" opacity="0.95">
        <path d="M-95,40 C-110,80 -100,130 -85,180 C-75,210 -60,230 -50,250" stroke="#ff66cc"/>
        <path d="M-100,45 C-125,90 -130,140 -120,190 C-115,220 -105,250 -95,270" stroke="#00ffaa"/>
        <path d="M-90,50 C-95,100 -80,150 -70,200 C-65,230 -55,260 -45,280" stroke="#ffaa00"/>
        <path d="M-105,35 C-140,85 -150,140 -145,195 C-140,230 -130,260 -120,285" stroke="#ff44aa"/>
        <path d="M-85,55 C-80,110 -65,160 -50,210 C-40,240 -30,265 -25,290" stroke="#00ccff"/>
        <path d="M-110,40 C-135,95 -145,155 -135,210 C-130,245 -120,275 -110,295" stroke="#aa66ff"/>
        <path d="M-80,48 C-70,105 -55,155 -40,205 C-30,235 -20,260 -15,280" stroke="#ff88cc"/>
        <path d="M-115,50 C-150,100 -160,160 -150,215 C-145,250 -135,280 -125,300" stroke="#00ffcc"/>
      </g>
      
      <!-- Extra thin tentacles -->
      <g stroke-width="1.2" fill="none" opacity="0.7">
        <path d="M-98,55 C-105,110 -95,165 -80,215" stroke="#ff99dd"/>
        <path d="M-88,60 C-75,120 -60,175 -45,225" stroke="#66ffcc"/>
        <path d="M-108,48 C-130,110 -140,170 -130,225" stroke="#ffcc66"/>
      </g>
      
      <!-- Jellyfish body / bell -->
      <ellipse cx="-105" cy="20" rx="38" ry="32" fill="url(#jellyGrad)" filter="url(#glow)"/>
      
      <!-- Inner glow rings -->
      <ellipse cx="-105" cy="18" rx="28" ry="22" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
      <ellipse cx="-105" cy="15" rx="18" ry="14" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
      
      <!-- Core bright spot -->
      <circle cx="-100" cy="12" r="8" fill="#ffffff" opacity="0.5"/>
    </g>
    
    <!-- Floating particles from jellyfish -->
    <g fill="#ff88cc" opacity="0.8">
      <circle cx="-70" cy="90" r="1.8"/>
      <circle cx="-50" cy="140" r="1.2"/>
      <circle cx="-90" cy="160" r="1.5"/>
      <circle cx="-40" cy="200" r="1.0"/>
      <circle cx="-110" cy="180" r="1.3"/>
      <circle cx="-60" cy="240" r="0.9"/>
      <circle cx="-30" cy="170" r="1.1"/>
      <circle cx="-130" cy="130" r="1.4"/>
    </g>
    <g fill="#00ffaa" opacity="0.7">
      <circle cx="-55" cy="110" r="1.3"/>
      <circle cx="-85" cy="200" r="1.0"/>
      <circle cx="-25" cy="220" r="1.2"/>
      <circle cx="-100" cy="250" r="0.9"/>
    </g>
  </g>
</svg>