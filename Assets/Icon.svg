<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Astronaut — Beyond the ordinary</title>
  <desc id="desc">A sleek white astronaut helmet framed by a luminous emerald and scarlet orbital halo on a rich green-to-red space gradient.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#063F32"/><stop offset=".46" stop-color="#10251F"/><stop offset="1" stop-color="#65172B"/>
    </linearGradient>
    <radialGradient id="greenGlow" cx="0" cy="0" r="1" gradientTransform="matrix(210 0 0 230 112 170)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#18E69A" stop-opacity=".55"/><stop offset="1" stop-color="#18E69A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redGlow" cx="0" cy="0" r="1" gradientTransform="matrix(190 0 0 230 410 340)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF3158" stop-opacity=".5"/><stop offset="1" stop-color="#FF3158" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbit" x1="78" y1="119" x2="435" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#62FFC0"/><stop offset=".48" stop-color="#E7FFF5"/><stop offset="1" stop-color="#FF526F"/>
    </linearGradient>
    <linearGradient id="shell" x1="155" y1="106" x2="361" y2="385" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/><stop offset=".55" stop-color="#E9F2EF"/><stop offset="1" stop-color="#AFC8C0"/>
    </linearGradient>
    <linearGradient id="glass" x1="177" y1="143" x2="342" y2="326" gradientUnits="userSpaceOnUse">
      <stop stop-color="#263D46"/><stop offset=".55" stop-color="#101D2A"/><stop offset="1" stop-color="#080F1A"/>
    </linearGradient>
    <linearGradient id="reflection" x1="185" y1="158" x2="275" y2="253" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B8FFE3" stop-opacity=".95"/><stop offset="1" stop-color="#B8FFE3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="suit" x1="176" y1="343" x2="336" y2="490" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FFFC"/><stop offset="1" stop-color="#A8C4BA"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
