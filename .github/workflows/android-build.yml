name: Android build

'on':
  push:
    branches: [main, 'feature/**', 'chore/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android tests and debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Run Android unit tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Run Android instrumentation smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: gradle --no-daemon :app:connectedDebugAndroidTest --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: astronaut-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
